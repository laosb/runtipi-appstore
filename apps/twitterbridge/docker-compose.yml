version: "3.9"
services:
  twitterbridge: # Should be exact same name as "id" field in config.json
    container_name: twitterbridge # Should be exact same name as "id" field in config.json
    image: ghcr.io/preloading/twitterapibridge:dev # Try to avoid "latest" tag. As it may break configs in the future.
    restart: unless-stopped # Do not change this
    environment:
      - TZ=${TZ} # Can use any env variable. See "environment variables" section in the docs
      - TWITTER_BRIDGE_DATABASE_TYPE=sqlite
      - TWITTER_BRIDGE_DATABASE_PATH=/config/database/sqlite.db
      - TWITTER_BRIDGE_CDN_URL=${TWITTER_BRIDGE_CDN_URL}
      - TWITTER_BRIDGE_SERVER_PORT=3000
      - TWITTER_BRIDGE_TRACK_ANALYTICS=true
      - TWITTER_BRIDGE_DEVELOPER_MODE=false
    volumes:
      - ${APP_DATA_DIR}/data/config:/config # Always start the path with ${APP_DATA_DIR}/data/. This will put all data inside app-data/my-app/data
    ports:
      - ${APP_PORT}:3000
    networks:
      - tipi_main_network # That should not be changed
    labels: # Use your editors search and replace feature to replace all instances of "myapp" with your app name in the traefik labels
      # Main
      traefik.enable: true
      traefik.http.middlewares.twitterbridge-web-redirect.redirectscheme.scheme: https
      traefik.http.services.twitterbridge.loadbalancer.server.port: 3000 # Should be the same as the app internal port so for this example 9443
      # Web
      traefik.http.routers.twitterbridge-insecure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.twitterbridge-insecure.entrypoints: web
      traefik.http.routers.twitterbridge-insecure.service: twitterbridge
      traefik.http.routers.twitterbridge-insecure.middlewares: twitterbridge-web-redirect
      # Websecure
      traefik.http.routers.twitterbridge.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.twitterbridge.entrypoints: websecure
      traefik.http.routers.twitterbridge.service: twitterbridge
      traefik.http.routers.twitterbridge.tls.certresolver: myresolver
      # Local domain
      traefik.http.routers.twitterbridge-local-insecure.rule: Host(`twitterbridge.${LOCAL_DOMAIN}`)
      traefik.http.routers.twitterbridge-local-insecure.entrypoints: web
      traefik.http.routers.twitterbridge-local-insecure.service: twitterbridge
      traefik.http.routers.twitterbridge-local-insecure.middlewares: twitterbridge-web-redirect
      # Local domain secure
      traefik.http.routers.twitterbridge-local.rule: Host(`twitterbridge.${LOCAL_DOMAIN}`)
      traefik.http.routers.twitterbridge-local.entrypoints: websecure
      traefik.http.routers.twitterbridge-local.service: twitterbridge
      traefik.http.routers.twitterbridge-local.tls: true
